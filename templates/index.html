<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Report Generator</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #daffe1;
            color: #333;
            margin: 0;
            padding: 0;
            min-height: 100vh; /* Ensure full height */
            min-width: 100vw; /* Ensure full width */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content{
            width: 70%;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            margin-top: -100px;
            color: #4CAF50;
        }

        section {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);
            margin: 20px auto;
            padding: 20px;
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 21vh;
        }

        h2 {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 85%;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        button:hover:enabled {
            background-color: #45a049;
        }
        
        hr{
            color: rgba(0, 0, 0, 0.747);
            width: 92%;
            opacity: 50%;
            margin-bottom: 10px;
            margin-top: -2px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
        }

        a:hover {
            background-color: #0056b3;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin-top: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            margin-top: auto; /* Push footer to the bottom */
            padding: 10px 0;
            background-color: #333;
            color: white;
        }
    </style>
    <script>
        async function handleApiCall(apiEndpoint, videoUrlInputId, downloadLinkId, buttonId, loaderId) {
            const videoUrl = document.getElementById(videoUrlInputId).value;
            const downloadButton = document.getElementById(downloadLinkId);
            const button = document.getElementById(buttonId);
            const loader = document.getElementById(loaderId);

            downloadButton.style.display = 'none';
            loader.style.display = 'inline-block';
            button.disabled = true;

            if (!videoUrl) {
                alert('Please provide a video URL.');
                loader.style.display = 'none';
                button.disabled = false;
                return;
            }

            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_url: videoUrl })
                });

                if (!response.ok) throw new Error('Error generating report.');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);

                downloadButton.href = url;
                downloadButton.download = apiEndpoint.includes('proctoring') ? 'Proctoring_Report.pdf' : 'Personality_Report.pdf';
                downloadButton.style.display = 'inline-block';
            } catch (error) {
                alert(error.message);
            } finally {
                loader.style.display = 'none';
                button.disabled = false;
            }
        }

        function handleAnalyzeProctoring() {
            handleApiCall('/analyse-proctoring', 'proctoringVideoUrl', 'proctoringDownload', 'analyzeButton', 'proctoringLoader');
        }

        function handlePredictPersonality() {
            handleApiCall('/predict-personality', 'personalityVideoUrl', 'personalityDownload', 'predictButton', 'personalityLoader');
        }
    </script>
</head>
<body>
    <h1>Proctoring Solution</h1>
    
    <div class="content">

        <!-- Proctoring Analysis Section -->
        <!-- <h2>Analyze Proctoring</h2> -->
        <section>
            <h2>Analyse Proctoring</h2>
            <!-- <hr> -->
            <!-- <label for="proctoringVideoUrl">Video URL:</label> -->
            <input type="text" id="proctoringVideoUrl" placeholder="Enter video URL">
            <button id="analyzeButton" onclick="handleAnalyzeProctoring()">Analyze Proctoring</button>
        <div id="proctoringLoader" class="loader"></div>
        <a id="proctoringDownload" style="display:none;">Download Proctoring Report</a>
    </section>
    
    <br>
    
</body>
</html>
